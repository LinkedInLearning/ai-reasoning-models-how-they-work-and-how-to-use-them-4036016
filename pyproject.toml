[project]
name = "qwen3-chainlit-example"
version = "0.1.0"
description = "Chainlit chat interface for the Qwen3 reasoning model example"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "blobfile>=3.0.0",
    "chainlit>=2.8.3",
    "huggingface-hub>=0.24.7",
    "reasoning-from-scratch>=0.1.21",
    "safetensors>=0.4.4",
    "sentencepiece>=0.1.99",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.1",
    "torch>=2.12.0",
    "transformers>=4.53.0,<5",
]

[tool.uv]
package = false
